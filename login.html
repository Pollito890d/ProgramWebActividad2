<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 2 - Utiliería</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="card">
        <h2>Registro</h2>
        <form id="registroForm">
            <!-- Nombre -->
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Ej. Juan Pérez">
                <span class="error-text" id="err-nombre">Solo se aceptan letras y acentos.</span>
            </div>
            <!-- CURP (Función libre) -->
            <div class="form-group">
                <label for="curp">CURP</label>
                <input type="text" id="curp" placeholder="18 caracteres (ej. ABCD010203HDFRRN09)" maxlength="18">
                <span class="error-text" id="err-curp">Formato de CURP no válido.</span>
            </div>
            <!-- Código Postal -->
            <div class="form-group">
                <label for="codigo">Código Postal (Máx. 5 dígitos)</label>
                <input type="text" id="codigo" placeholder="Ej. 68000">
                <span class="error-text" id="err-codigo">Debe ser numérico y máximo de 5 dígitos.</span>
            </div>
            <!-- Fecha de Nacimiento -->
            <div class="form-group">
                <label for="nacimiento">Fecha de Nacimiento</label>
                <input type="date" id="nacimiento">
                <span class="error-text" id="err-nacimiento">Debes ser mayor de edad (+18).</span>
            </div>
            <!-- Contraseña -->
            <div class="form-group">
                <label for="pass">Contraseña</label>
                <input type="password" id="pass" placeholder="••••••••">
                <span class="error-text" id="err-pass">Mínimo 8 caracteres, una mayúscula, una minúscula, un número y un símbolo.</span>
            </div>
            <button type="submit" class="btn">Validar y Registrar</button>
        </form>
        <a href="./index.html" class="nav-link">¿Ya tienes cuenta? Ir a Iniciar Sesión</a>
    </div>
    <!-- Modal con Edad y Cumpleaños -->
    <div class="modal-overlay" id="modalResultado">
        <div class="modal-content">
            <h3>¡Registro Válido!</h3>
            <p id="txtEdad" style="margin-top: 10px;"></p>
            <p id="txtCumple" style="margin-top: 8px; font-weight: bold; color: #2b6cb0;"></p>
            <button class="btn btn-close" id="btnCerrarModal">Cerrar</button>
        </div>
    </div>
    <!-- Enlace a la librería -->
    <script src="./js/utileria.js"></script>
    <!-- Script de conexión con la interfaz -->
    <script src="./js/procesamientodatos.js"></script>

</body>
</html>
